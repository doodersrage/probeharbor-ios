name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: .build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ProbeHarbor.xcodeproj \
            -scheme ProbeHarbor \
            -destination "id=$SIM_UDID" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print(f"result={r.get(\"result\")} total={r.get(\"totalTestCount\")} passed={r.get(\"passedTests\")} failed={r.get(\"failedTests\")} skipped={r.get(\"skippedTests\")}")' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
